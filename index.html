<!DOCTYPE html>
<html lang="en">

<head   >


<link href="https://fonts.googleapis.com/icon?family=Material+Icons"
rel="stylesheet">

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>English Flashcards</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="loginPage">


<div class="loginCard">

    
    <span class="material-symbols-sharp material-icons">
spellcheck
</span>

    <h1>Flashcards</h1>

    <p class="loginSubtitle">
        Sign in to continue
    </p>

    <div class="inputGroup">
        <input
            id="txtUsername"
            type="text"
            placeholder=" ">
        <label>Username</label>
    </div>

    <div class="inputGroup">
        <input
            id="txtPassword"
            type="password"
            placeholder=" ">
        <label>Password</label>
    </div>

    <button id="btnLogin">
        Login
    </button>

    <div id="loginMessage"></div>

</div>



</div>

<div id="appContainer"  style="display:none;" >

    <!-- کل سایت فعلی اینجا قرار می‌گیرد -->
<div class="layout">












    <!-- ========================= -->
    <!-- Sidebar -->
    <!-- ========================= -->

    <aside class="sidebar" id="sidebar">

<div class="logo" id="btnCollapse">

    📘 Flashcards

</div>

        <button
            class="menuItem active"
            id="menuPractice">



           <span class="material-icons">
school
</span>

<span class="menuText">
Practice
</span>

        </button>

        <button
            class="menuItem"
            id="menuAddWord">

            <span class="material-icons">
add_circle
</span>

<span class="menuText">
Add Word
</span>

        </button>

        <button
            class="menuItem"
            id="menuStatistics">

            <span class="material-icons">
bar_chart
</span>

<span class="menuText">
Statistics
</span>

        </button>

        <button
        class="menuItem"
        id="menuHeatmap">

            <span class="material-icons">
calendar_month
</span>

<span class="menuText">
Heatmap
</span>

        </button>


    </aside>


    <!-- ========================= -->
    <!-- Main -->
    <!-- ========================= -->

    <main class="mainContent">

        <!-- Mobile Header -->

        <header class="mobileHeader">

            <button
                id="btnMenu"
                class="menuButton">

                ☰

            </button>

            <span>

                English Flashcards

            </span>

        </header>


        <!-- ========================= -->
        <!-- Categories -->
        <!-- ========================= -->

        <section id="pageCategories">

            <h1>

                English Flashcards

            </h1>

<!-- Skeleton -->
<div class="streakCard" id="streakCard">

    <div class="streakIcon">
        🔥
    </div>

    <div>

        <div class="streakTitle">
            Current Streak
        </div>

        <div
            id="streakValue"
            class="streakValue">

            0 Days

        </div>

    </div>

</div>



<div
    id="categories"
    class="grid">

</div>

<div
    id="categoriesSkeleton"
    class="grid"
    style="display:none;">
</div>

        </section>


        <!-- ========================= -->
        <!-- Stages -->
        <!-- ========================= -->

        <section
            id="pageStages"
            style="display:none;">

            <div class="topbar">

                <button
                    id="btnBackCategories">

                    ← Categories

                </button>

                <h2 id="categoryName">

                </h2>

            </div>

<div id="summarySkeleton" class="summaryCard" style="display:none;">

    <div class="summaryItem">
        <div class="summarySkeletonTitle"></div>
        <div class="summarySkeletonValue"></div>
    </div>

    <div class="summaryItem">
        <div class="summarySkeletonTitle"></div>
        <div class="summarySkeletonValue"></div>
    </div>

    <div class="summaryItem">
        <div class="summarySkeletonTitle"></div>
        <div class="summarySkeletonValue"></div>
    </div>

</div>


            <div class="summaryCard"   id="summaryCard">

                <div class="summaryItem">

                    <div class="summaryTitle">

                        Total Words

                    </div>

                    <div
                        id="totalWords"
                        class="summaryValue">

                        0

                    </div>

                </div>

                <div class="summaryItem">

                    <div class="summaryTitle">

                        Ready Today

                    </div>

                    <div
                        id="readyWords"
                        class="summaryValue">

                        0

                    </div>

                </div>

                <div class="summaryItem">

                    <div class="summaryTitle">

                        Progress

                    </div>

                    <div
                        id="progressPercent"
                        class="summaryValue">

                        0%

                    </div>

                </div>

            </div>



<div id="stagesSkeleton" class="grid" style="display:none">

    <div class="stageSkeleton"></div>
    <div class="stageSkeleton"></div>
    <div class="stageSkeleton"></div>
    <div class="stageSkeleton"></div>
    <div class="stageSkeleton"></div>
    <div class="stageSkeleton"></div>

</div>



            <div
                id="stages"
                class="grid">

            </div>

        </section>



        <!-- ========================= -->
        <!-- Study Page -->
        <!-- ========================= -->

        <section
            id="pageStudy"
            style="display:none;">

            <div class="topbar">

                <button
                    id="btnBackStages">

                    ← Stages

                </button>

                <span id="progress">

                </span>



            </div>

            <div class="studyHeader">

    			<div id="studyPath"></div>

   		 	<h2 id="studyTitle"></h2>

		</div>



            </h2>

            <div class="card" id="wordCard">

                <div id="word">

                </div>

            </div>

            <div class="dictation">

                <input

                    id="txtAnswer"

                    type="text"

                    autocomplete="off"

                    spellcheck="false"

                    placeholder="Type the word..."

                >

                <button
                    id="btnCheck">

                    Check

                </button>

            </div>

            <div
                id="result"
                class="result">

            </div>

            <div
                id="correctWord"
                class="correctWord">

            </div>

<div
    id="compareResult"
    class="spellCompare">
</div>

            <div
                id="reviewButtons"
                class="reviewButtons"
                style="display:none;">

                <button id="btnKnow">

                    ✅ Know

                </button>

                <button id="btnDontKnow">

                    ❌ Don't Know

                </button>

                <button id="btnMaster">

                    ⭐ Master

                </button>

            </div>

        </section>



        <!-- ========================= -->
        <!-- Finish -->
        <!-- ========================= -->

        <section

            id="pageFinish"

            style="display:none;">

            <div class="finish">

                <h1>

                    🎉

                </h1>

                <h2>

                    Congratulations!

                </h2>

                <p>

                    You have finished this stage.

                </p>

                <button
                    id="btnFinishBack">

                    Back

                </button>

            </div>

        </section>



        <!-- ========================= -->
        <!-- Add Word -->
        <!-- ========================= -->

        <section

            id="pageAddWord"

            style="display:none;">

            <h2>

                Add New Word

            </h2>

            <div class="addWordCard">

                <label>

                    Category

                </label>

                <select id="cmbCategory">

                </select>


<label>

    Front

</label>

<input

    id="txtFront"

    type="text"

    placeholder="Front"

>

<label>

    Back

</label>

<input

    id="txtBack"

    type="text"

    placeholder="Back"

>


                <button
                    id="btnSaveWord">

                    Save

                </button>


                <div
                    id="saveMessage">

                </div>

            </div>

        </section>


<!-- ========================= -->
<!-- Statistics -->
<!-- ========================= -->

<section
    id="pageStatistics"
    style="display:none;">

    <h2>

        Statistics

    </h2>

    <div class="statisticsToolbar">

    <label>

        Month

    </label>

    <select id="cmbStatisticsMonth">

    </select>

</div>

    <div class="statisticsCard chartContainer">

        <canvas
            id="statisticsChart">

        </canvas>

    </div>

</section>





<!-- ========================= -->
<!-- Heatmap -->
<!-- ========================= -->

<section

    id="pageHeatmap"

    style="display:none;">

    <h2>

        Study Heatmap

    </h2>


    <div class="heatmapCard">

        <div id="heatmapContainer">

        </div>

    </div>


</section>





    </main>

</div>

</div>



<!-- ========================= -->
<!-- Mobile Overlay -->
<!-- ========================= -->

<div
    id="overlay"
    class="overlay">

</div>


<!-- Loading -->

<div id="loading">

    <div class="loader"></div>

</div>



<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="app.js"></script>






</body>

</html>
